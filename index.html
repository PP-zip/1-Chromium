<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Game · Class Zoo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', 'Quicksand', sans-serif;
            background: linear-gradient(145deg, #fde9d0 0%, #f7d9b8 100%);
            min-height: 100vh;
            padding: 24px 16px 300px;
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }

        .app-header { text-align: center; margin-bottom: 20px; width: 100%; }
        .app-header h1 {
            font-size: 2.6rem; letter-spacing: 3px; color: #6b3f1c;
            text-shadow: 4px 4px 0 #ffdbb5, 6px 6px 0 rgba(180, 120, 70, 0.2);
            display: flex; justify-content: center; align-items: center; gap: 16px; flex-wrap: wrap;
        }
        .app-header h1 span { font-size: 2.8rem; }
        .subhead {
            font-size: 1rem; color: #856a4b; background: #fff6e9;
            display: inline-block; padding: 6px 20px; border-radius: 40px; margin-top: 8px;
            border: 1px solid #e5c9a8; box-shadow: 0 4px 8px rgba(160, 120, 80, 0.1);
            font-weight: 600;
        }
        .subhead .highlight { color: #c45d1a; font-weight: 800; }

        /* 🔊 音效开关 */
        .sound-toggle {
            position: fixed; top: 16px; right: 16px;
            background: #fff6e9; border: 2px solid #d9b382;
            border-radius: 40px; padding: 8px 16px;
            font-size: 1rem; font-weight: 700; color: #5a3a1e;
            cursor: pointer; z-index: 100;
            box-shadow: 0 4px 0 #b48b5a;
            font-family: inherit;
            display: flex; align-items: center; gap: 6px;
            transition: all 0.1s;
        }
        .sound-toggle:active { transform: translateY(3px); box-shadow: 0 1px 0 #b48b5a; }
        .sound-toggle.muted { background: #e8e8e8; color: #999; }

        /* 动物园围栏 */
        .zoo-section {
            max-width: 1400px; width: 100%; margin: 0 auto 24px;
            background: linear-gradient(180deg, #d4edc0 0%, #b8d9a0 100%);
            border-radius: 40px;
            border: 4px dashed #7a9e5a;
            padding: 16px 20px 20px;
            box-shadow: inset 0 4px 20px rgba(90, 130, 60, 0.2), 0 8px 20px rgba(0,0,0,0.1);
            position: relative;
        }
        .zoo-title {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-size: 1.4rem; font-weight: 800; color: #3e5a26;
            text-shadow: 2px 2px 0 #e0f0c8;
            margin-bottom: 12px;
        }
        .zoo-title span { font-size: 1.8rem; }
        .zoo-fence {
            display: flex; flex-wrap: wrap; gap: 14px;
            justify-content: center; align-items: flex-end;
            min-height: 110px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            border: 2px solid rgba(122, 158, 90, 0.4);
        }
        .zoo-empty {
            color: #6a8a4a; font-style: italic; font-weight: 600;
            padding: 20px; font-size: 0.95rem;
        }
        .zoo-pet {
            display: flex; flex-direction: column; align-items: center;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 24px; padding: 8px 12px 6px;
            border: 2px solid #8aae6a;
            box-shadow: 0 4px 0 rgba(90, 130, 60, 0.3);
            animation: zooBob 2s ease-in-out infinite;
            transition: transform 0.3s;
            position: relative;
        }
        .zoo-pet:nth-child(odd) { animation-delay: 0.5s; }
        .zoo-pet:nth-child(3n) { animation-delay: 1s; }
        @keyframes zooBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .zoo-pet-emoji { font-size: 2.6rem; line-height: 1; }
        .zoo-pet-name {
            font-size: 0.7rem; font-weight: 700; color: #3e5a26;
            background: #fef8e6; padding: 2px 8px; border-radius: 20px;
            margin-top: 4px; white-space: nowrap;
            border: 1px solid #c8d8a8;
        }
        .zoo-pet-owner {
            font-size: 0.6rem; font-weight: 700; color: #fff;
            background: #7a9e5a; padding: 1px 8px; border-radius: 20px;
            margin-top: 2px; white-space: nowrap;
        }

        .class-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px;
            max-width: 1400px; width: 100%; margin: 0 auto;
        }

        .student-card {
            background: #fffbf4;
            border-radius: 28px 28px 20px 20px;
            padding: 12px 10px 14px;
            box-shadow: 0 8px 0 #c9a87c, 0 10px 18px rgba(100, 70, 40, 0.2);
            border: 2px solid #dbbd99;
            display: flex; flex-direction: column; align-items: center;
            transition: all 0.15s ease;
        }
        .student-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 0 #b48b5a, 0 14px 22px rgba(100, 70, 40, 0.25);
        }

        .card-top {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; gap: 6px; margin-bottom: 8px;
        }
        .student-name-row {
            display: flex; align-items: center; gap: 4px;
            font-weight: 700; color: #4e321a;
            background: #f3e2cf; padding: 3px 8px; border-radius: 40px;
            border: 1px solid #d6b28b; font-size: 0.8rem;
            flex: 1; min-width: 0;
        }
        .student-name-row input {
            border: none; background: transparent; font-weight: 700; color: #4e321a;
            font-size: 0.8rem; width: 100%; text-align: center; outline: none;
            font-family: inherit; border-bottom: 1px dashed #b48b5a;
            min-width: 0;
        }
        .student-name-row input:focus { border-bottom: 1px solid #e38b3c; }
        .mini-score {
            display: flex; align-items: center; gap: 2px;
            background: #fef0da; border-radius: 40px; padding: 3px 8px;
            font-weight: 700; font-size: 0.75rem; color: #704f2c;
            border: 1px solid #d6ad7a;
            white-space: nowrap;
        }

        .pet-slots {
            display: flex; flex-direction: column; gap: 8px;
            width: 100%;
        }
        .pet-slot {
            background: #f7ede0;
            border-radius: 20px;
            padding: 6px 6px 8px;
            border: 2px solid #d9b382;
            display: flex; flex-direction: column; align-items: center;
            min-height: 130px;
            position: relative;
            transition: background 0.2s;
        }
        .slot-label {
            position: absolute; top: 4px; left: 8px;
            font-size: 0.6rem; font-weight: 800; color: #a08868;
            letter-spacing: 0.5px;
        }

        .pet-emoji-sm {
            font-size: 2.6rem; line-height: 1;
            filter: drop-shadow(2px 3px 3px rgba(0, 0, 0, 0.15));
            transition: transform 0.2s;
            margin-top: 4px;
        }
        .pet-emoji-sm.egg { font-size: 2.4rem; }
        .pet-emoji-sm.stage-baby { font-size: 2.2rem; }
        .pet-emoji-sm.stage-teen { font-size: 2.6rem; }
        .pet-emoji-sm.stage-adult { font-size: 3rem; }

        .pet-name-sm {
            font-size: 0.7rem; font-weight: 700; color: #5a3a1e;
            text-shadow: 1px 1px 0 #ffe3c1; margin-top: 2px;
            white-space: nowrap; max-width: 100%;
            overflow: hidden; text-overflow: ellipsis;
            cursor: pointer; padding: 1px 6px; border-radius: 12px;
            transition: background 0.2s;
        }
        .pet-name-sm:hover { background: #ffe3ba; }
        .pet-name-sm input {
            border: none; background: transparent; font-weight: 700; color: #5a3a1e;
            font-size: 0.7rem; width: 70px; text-align: center; outline: none;
            font-family: inherit; border-bottom: 1px dashed #b48b5a;
        }

        .stage-badge {
            font-size: 0.55rem; font-weight: 800;
            padding: 1px 6px; border-radius: 10px;
            margin-top: 2px;
            letter-spacing: 0.3px;
        }
        .stage-badge.baby { background: #ffe0b8; color: #b06a1a; }
        .stage-badge.teen { background: #c8e8b8; color: #3a7a1a; }
        .stage-badge.adult { background: #ffd0e0; color: #b02a5a; }

        .mood-mini {
            font-size: 0.6rem; font-weight: 700;
            padding: 1px 6px; border-radius: 10px;
            margin-top: 1px;
        }
        .mood-mini.happy { background: #e6f7e0; color: #3a7a2a; }
        .mood-mini.okay { background: #fff5d9; color: #8a6a1a; }
        .mood-mini.sad { background: #ffe0e0; color: #b03a3a; }

        .status-mini {
            width: 100%; display: flex; flex-direction: column; gap: 3px;
            margin: 4px 0 4px;
        }
        .status-mini-row {
            display: flex; align-items: center; gap: 4px;
            font-size: 0.6rem; font-weight: 700; color: #583e26;
        }
        .bar-bg-xs {
            flex: 1; height: 8px; background: #b3926b; border-radius: 10px;
            overflow: hidden; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
        }
        .bar-fill-xs {
            height: 100%; width: 0%; border-radius: 10px;
            transition: width 0.3s;
        }
        .bar-fill-xs.hunger { background: linear-gradient(90deg, #f9a95a, #ffcb7a); }
        .bar-fill-xs.thirst { background: linear-gradient(90deg, #4aa3f0, #7ac4ff); }
        .bar-fill-xs.hunger.low { background: linear-gradient(90deg, #e63946, #f77f7f); }
        .bar-fill-xs.thirst.low { background: linear-gradient(90deg, #d64545, #f28b8b); }

        .slot-actions {
            display: flex; flex-wrap: wrap; gap: 3px; width: 100%;
            justify-content: center; margin-top: 3px;
        }
        .mini-btn {
            background: #ffe3ba; border: none; border-radius: 30px;
            padding: 3px 5px; font-size: 0.55rem; font-weight: 700;
            color: #4b301a; box-shadow: 0 2px 0 #b07d4f;
            cursor: pointer; transition: all 0.06s linear;
            border: 1px solid #eebe88;
            display: flex; align-items: center; gap: 1px;
            font-family: inherit; flex: 1 0 auto;
            justify-content: center; min-width: 36px;
        }
        .mini-btn:active { transform: translateY(2px); box-shadow: 0 0 0 #b07d4f; }
        .mini-btn:disabled {
            opacity: 0.4; transform: translateY(1px);
            box-shadow: 0 1px 0 #7a5e3e; pointer-events: none;
        }
        .mini-btn.hatch { background: #f5e1c1; box-shadow: 0 2px 0 #9c7c5a; }
        .mini-btn.feed { background: #ffdca8; box-shadow: 0 2px 0 #b97936; }
        .mini-btn.water { background: #b8ddff; box-shadow: 0 2px 0 #5982b0; }
        .mini-btn.chicken { background: #f5c7a9; box-shadow: 0 2px 0 #b87a4a; }
        .mini-btn.thirsty { background: #c9e4ff; box-shadow: 0 2px 0 #5a8ab0; }
        .mini-btn.hungry { background: #ffd0d0; box-shadow: 0 2px 0 #b05a5a; }

        .pet-choice-row {
            display: flex; gap: 2px; margin-top: 3px; flex-wrap: wrap;
            justify-content: center; max-height: 52px; overflow-y: auto;
        }
        .pet-choice-btn {
            background: #f3e2cf; border: 1px solid #d6b28b;
            border-radius: 12px; padding: 1px 3px; font-size: 0.7rem;
            cursor: pointer; transition: all 0.1s; font-family: inherit;
        }
        .pet-choice-btn:hover { background: #ffe3ba; }
        .pet-choice-btn.active {
            background: #ffdca8; border-color: #c45d1a;
            box-shadow: 0 0 0 1px #ffb86b;
        }

        .free-range {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 240px;
            background: linear-gradient(180deg, rgba(212, 237, 192, 0.0) 0%, rgba(180, 217, 160, 0.6) 40%, rgba(160, 200, 140, 0.8) 100%);
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }
        .free-range::before {
            content: '';
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 20px;
            background: repeating-linear-gradient(90deg, #8aae6a 0 20px, #7a9e5a 20px 40px);
            opacity: 0.5;
        }
        .free-pet {
            position: absolute;
            display: flex; flex-direction: column; align-items: center;
            transition: left 4s linear, top 4s linear;
            pointer-events: auto;
            cursor: pointer;
        }
        .free-pet-emoji {
            font-size: 3.2rem;
            filter: drop-shadow(3px 5px 4px rgba(0, 0, 0, 0.2));
            animation: freeBounce 1.5s ease-in-out infinite;
        }
        @keyframes freeBounce {
            0%, 100% { transform: translateY(0) scaleX(1); }
            50% { transform: translateY(-5px) scaleX(-1); }
        }
        .free-pet-name {
            font-size: 0.65rem; font-weight: 700;
            background: #fff8ee; padding: 1px 8px;
            border-radius: 20px; color: #5a3a1e;
            border: 1px solid #d9b382;
            white-space: nowrap;
            margin-top: 2px;
        }

        .global-reset {
            margin-top: 32px; text-align: center;
            position: relative; z-index: 20;
        }
        .global-reset button {
            background: #e9d5b5; border: 2px dashed #b48b5a;
            border-radius: 60px; padding: 12px 32px;
            font-size: 1rem; font-weight: 700; color: #5e3e1f;
            cursor: pointer; transition: all 0.2s;
            box-shadow: 0 5px 0 #a5835e;
            font-family: inherit;
        }
        .global-reset button:active {
            transform: translateY(3px); box-shadow: 0 2px 0 #a5835e;
        }

        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(6deg); }
            75% { transform: rotate(-6deg); }
            100% { transform: rotate(0deg); }
        }
        .shake { animation: shake 0.25s ease-in-out; }

        @media (max-width: 1200px) { .class-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 950px) {
            .class-grid { grid-template-columns: repeat(3, 1fr); }
            .app-header h1 { font-size: 2rem; }
        }
        @media (max-width: 700px) {
            .class-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 450px) {
            .class-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- 🔊 音效开关 -->
    <button class="sound-toggle" id="soundToggle" title="Toggle sound">
        <span id="soundIcon">🔊</span>
        <span id="soundText">Sound ON</span>
    </button>

    <div class="app-header">
        <h1><span>🥚</span> Pet Game · Class Zoo <span>🦁</span></h1>
        <div class="subhead">
            🐾 25 students · 30 animals · 
            <span class="highlight">Hatch needs 20 pts</span> · Baby → Teen → Adult
        </div>
    </div>

    <div class="zoo-section">
        <div class="zoo-title">
            <span>🦁</span> Class Zoo (Teen Pets) <span>🦊</span>
        </div>
        <div class="zoo-fence" id="zooFence">
            <div class="zoo-empty">No teen pets yet. Feed your baby pet to help it grow!</div>
        </div>
    </div>

    <div class="class-grid" id="classGrid"></div>

    <div class="global-reset">
        <button id="resetAllBtn">🔄 Reset All Students</button>
    </div>

    <div class="free-range" id="freeRange"></div>

    <script>
        (function() {
            // ============ 🔉 音效引擎 ============
            // 使用 Web Audio API 生成音效，无需外部文件
            let audioCtx = null;
            let soundEnabled = true;

            function getAudioCtx() {
                if (!audioCtx) {
                    try {
                        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    } catch (e) { console.warn('Audio not supported'); }
                }
                // 某些浏览器需要用户交互才能启动
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                return audioCtx;
            }

            // 播放单个音符
            function playTone(freq, duration, type = 'sine', volume = 0.15, delay = 0) {
                if (!soundEnabled) return;
                const ctx = getAudioCtx();
                if (!ctx) return;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);

                gain.gain.setValueAtTime(0, ctx.currentTime + delay);
                gain.gain.linearRampToValueAtTime(volume, ctx.currentTime + delay + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime + delay);
                osc.stop(ctx.currentTime + delay + duration + 0.05);
            }

            // 频率滑动（用于扣分）
            function playSlide(freqStart, freqEnd, duration, type = 'sine', volume = 0.15) {
                if (!soundEnabled) return;
                const ctx = getAudioCtx();
                if (!ctx) return;

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freqStart, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(freqEnd, ctx.currentTime + duration);

                gain.gain.setValueAtTime(volume, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + duration + 0.05);
            }

            // 🎵 定义各种音效
            const SoundFX = {
                // 🍎 水果 +1：清脆"叮"
                fruit() {
                    playTone(880, 0.12, 'sine', 0.18);
                    playTone(1320, 0.1, 'sine', 0.1, 0.06);
                },
                // 🍗 食物 +2：双音"叮咚"
                food() {
                    playTone(660, 0.1, 'triangle', 0.18);
                    playTone(880, 0.14, 'triangle', 0.18, 0.1);
                    playTone(1100, 0.16, 'sine', 0.12, 0.2);
                },
                // 💧 喝水 +1：流水般"咕噜"
                water() {
                    playTone(523, 0.1, 'sine', 0.15);
                    playTone(659, 0.1, 'sine', 0.15, 0.08);
                    playTone(784, 0.15, 'sine', 0.12, 0.16);
                },
                // 🥵 口渴 -1：下滑音"嘟——"
                thirsty() {
                    playSlide(700, 350, 0.28, 'sawtooth', 0.12);
                },
                // 😫 饥饿 -2：低沉"咚咚"
                hungry() {
                    playTone(180, 0.18, 'sawtooth', 0.16);
                    playTone(140, 0.22, 'sawtooth', 0.16, 0.14);
                },
                // 🐣 孵蛋：上升三连音
                hatch() {
                    playTone(523, 0.14, 'sine', 0.18, 0);
                    playTone(659, 0.14, 'sine', 0.18, 0.12);
                    playTone(784, 0.22, 'sine', 0.2, 0.24);
                },
                // 🎉 成长升级：胜利号角
                levelUp() {
                    playTone(659, 0.12, 'triangle', 0.18, 0);
                    playTone(784, 0.12, 'triangle', 0.18, 0.1);
                    playTone(1046, 0.14, 'triangle', 0.2, 0.2);
                    playTone(1318, 0.3, 'sine', 0.18, 0.34);
                },
                // ❌ 分数不足：短促低音
                error() {
                    playTone(200, 0.15, 'square', 0.1);
                },
            };

            // 音效开关
            function updateSoundToggleUI() {
                const icon = document.getElementById('soundIcon');
                const text = document.getElementById('soundText');
                const btn = document.getElementById('soundToggle');
                if (soundEnabled) {
                    icon.textContent = '🔊';
                    text.textContent = 'Sound ON';
                    btn.classList.remove('muted');
                } else {
                    icon.textContent = '🔇';
                    text.textContent = 'Sound OFF';
                    btn.classList.add('muted');
                }
            }

            // ============ 配置 ============
            const STUDENT_COUNT = 25;
            const SLOTS_PER_STUDENT = 3;
            const INIT_SCORE = 0;
            const SCORE_HATCH_COST = 20;
            const DECAY_INTERVAL_MS = 30000;
            const MAX_SCORE = 999;
            const STORAGE_KEY = 'petGameZoo_v2';

            const STAGE_TEEN_FEED = 5;
            const STAGE_TEEN_SUM = 120;
            const STAGE_ADULT_FEED = 12;
            const STAGE_ADULT_SUM = 180;

            const EGG_INIT_HUNGER = 0;
            const EGG_INIT_THIRST = 0;

            const FEED_OPTIONS = {
                water: { score: 1, hunger: 0,  thirst: 15, icon: '💧' },
                fruit: { score: 1, hunger: 12, thirst: 5,  icon: '🍎' },
                food:  { score: 2, hunger: 25, thirst: 0,  icon: '🍗' },
            };

            const PET_TYPES = [
                { id: 'dog',      name: 'Dog',      emoji: '🐶' },
                { id: 'cat',      name: 'Cat',      emoji: '🐱' },
                { id: 'pig',      name: 'Pig',      emoji: '🐷' },
                { id: 'sheep',    name: 'Sheep',    emoji: '🐑' },
                { id: 'rabbit',   name: 'Rabbit',   emoji: '🐰' },
                { id: 'dolphin',  name: 'Dolphin',  emoji: '🐬' },
                { id: 'dino',     name: 'Dino',     emoji: '🦖' },
                { id: 'turtle',   name: 'Turtle',   emoji: '🐢' },
                { id: 'penguin',  name: 'Penguin',  emoji: '🐧' },
                { id: 'monkey',   name: 'Monkey',   emoji: '🐵' },
                { id: 'panda',    name: 'Panda',    emoji: '🐼' },
                { id: 'frog',     name: 'Frog',     emoji: '🐸' },
                { id: 'lion',     name: 'Lion',     emoji: '🦁' },
                { id: 'tiger',    name: 'Tiger',    emoji: '🐯' },
                { id: 'bear',     name: 'Bear',     emoji: '🐻' },
                { id: 'koala',    name: 'Koala',    emoji: '🐨' },
                { id: 'fox',      name: 'Fox',      emoji: '🦊' },
                { id: 'wolf',     name: 'Wolf',     emoji: '🐺' },
                { id: 'cow',      name: 'Cow',      emoji: '🐮' },
                { id: 'horse',    name: 'Horse',    emoji: '🐴' },
                { id: 'unicorn',  name: 'Unicorn',  emoji: '🦄' },
                { id: 'dragon',   name: 'Dragon',   emoji: '🐉' },
                { id: 'shark',    name: 'Shark',    emoji: '🦈' },
                { id: 'whale',    name: 'Whale',    emoji: '🐋' },
                { id: 'octopus',  name: 'Octopus',  emoji: '🐙' },
                { id: 'crab',     name: 'Crab',     emoji: '🦀' },
                { id: 'butterfly',name: 'Butterfly',emoji: '🦋' },
                { id: 'bee',      name: 'Bee',      emoji: '🐝' },
                { id: 'owl',      name: 'Owl',      emoji: '🦉' },
                { id: 'parrot',   name: 'Parrot',   emoji: '🦜' },
            ];

            const DEFAULT_NAMES = [
                "小智","小美","小刚","小霞","小遥","小胜","小光","小豪","小春","小杰",
                "小玲","小峰","小云","小海","小星","小月","小阳","小希","小望","小梦",
                "小宇","小甜","小乐","小安","小新"
            ];

            const PET_NAMES = ['小汪','咪咪','团团','糯米','豆豆','糖糖','布丁','小可','奇奇','花花','球球','多多','妞妞','贝贝','皮皮'];

            let students = [];
            let globalDecayInterval = null;
            let freeMoveInterval = null;

            // ============ 保存/加载 ============
            function saveData() {
                try {
                    const data = {
                        students: students.map(s => ({
                            studentName: s.studentName,
                            score: s.score,
                            pets: s.pets.map(p => ({
                                id: p.id, isEgg: p.isEgg, petName: p.petName,
                                petType: p.petType, hunger: p.hunger, thirst: p.thirst,
                                feedCount: p.feedCount, stage: p.stage,
                            })),
                        })),
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                } catch (e) { console.warn('Save failed:', e); }
            }

            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return false;
                    const data = JSON.parse(raw);
                    if (!data.students || data.students.length !== STUDENT_COUNT) return false;
                    students = data.students.map((s, i) => ({
                        id: i,
                        studentName: s.studentName || DEFAULT_NAMES[i] || `同学${i+1}`,
                        score: typeof s.score === 'number' ? s.score : INIT_SCORE,
                        pets: (s.pets || []).map(p => ({
                            id: p.id, isEgg: typeof p.isEgg === 'boolean' ? p.isEgg : true,
                            petName: p.petName || '蛋蛋', petType: p.petType || null,
                            hunger: typeof p.hunger === 'number' ? p.hunger : EGG_INIT_HUNGER,
                            thirst: typeof p.thirst === 'number' ? p.thirst : EGG_INIT_THIRST,
                            feedCount: typeof p.feedCount === 'number' ? p.feedCount : 0,
                            stage: p.stage || 'baby',
                        })),
                    }));
                    students.forEach(s => {
                        while (s.pets.length < SLOTS_PER_STUDENT) s.pets.push(createNewEgg());
                        s.pets = s.pets.slice(0, SLOTS_PER_STUDENT);
                    });
                    return true;
                } catch (e) { console.warn('Load failed:', e); return false; }
            }

            function createNewEgg() {
                return {
                    id: 'pet_' + Math.random().toString(36).substr(2, 9),
                    isEgg: true, petName: '蛋蛋', petType: null,
                    hunger: EGG_INIT_HUNGER, thirst: EGG_INIT_THIRST,
                    feedCount: 0, stage: 'baby',
                };
            }

            function initStudents() {
                students = [];
                for (let i = 0; i < STUDENT_COUNT; i++) {
                    students.push({
                        id: i,
                        studentName: DEFAULT_NAMES[i] || `同学${i+1}`,
                        score: INIT_SCORE,
                        pets: [createNewEgg(), createNewEgg(), createNewEgg()],
                    });
                }
            }

            // ============ 工具 ============
            function getMood(pet) {
                if (pet.isEgg) return { emoji: '🥚', label: 'Egg', className: 'okay' };
                const h = pet.hunger, t = pet.thirst;
                if (h < 15) return { emoji: '😫', label: 'Starving', className: 'sad' };
                if (t < 15) return { emoji: '😫', label: 'Dehydrated', className: 'sad' };
                if (h < 35) return { emoji: '😿', label: 'Hungry', className: 'sad' };
                if (t < 35) return { emoji: '😿', label: 'Thirsty', className: 'sad' };
                if (h < 60 || t < 60) return { emoji: '😐', label: 'Okay', className: 'okay' };
                return { emoji: '😊', label: 'Happy', className: 'happy' };
            }

            function getStageEmoji(pet) {
                if (pet.isEgg) return '🥚';
                if (!pet.petType) return '❓';
                const t = PET_TYPES.find(p => p.id === pet.petType);
                return t ? t.emoji : '❓';
            }

            function getStageLabel(stage) {
                if (stage === 'baby') return '👶 Baby';
                if (stage === 'teen') return '🧒 Teen';
                if (stage === 'adult') return '🧑 Adult';
                return '👶 Baby';
            }

            // 🎵 返回旧阶段，方便比较是否升级
            function updateStage(pet) {
                if (pet.isEgg || !pet.petType) return;
                const oldStage = pet.stage;
                const sum = pet.hunger + pet.thirst;
                let newStage = 'baby';
                if (pet.feedCount >= STAGE_ADULT_FEED && sum >= STAGE_ADULT_SUM) {
                    newStage = 'adult';
                } else if (pet.feedCount >= STAGE_TEEN_FEED && sum >= STAGE_TEEN_SUM) {
                    newStage = 'teen';
                }
                if (newStage !== oldStage) {
                    pet.stage = newStage;
                    // 🎉 升级音效！
                    if (newStage !== 'baby') {
                        SoundFX.levelUp();
                    }
                }
            }

            // ============ 渲染 ============
            function renderAll() { renderZoo(); renderCards(); renderFreeRange(); }

            function renderZoo() {
                const fence = document.getElementById('zooFence');
                fence.innerHTML = '';
                const teens = [];
                students.forEach(s => {
                    s.pets.forEach(p => {
                        if (!p.isEgg && p.stage === 'teen' && p.petType) {
                            teens.push({
                                petId: p.id, ownerName: s.studentName,
                                petName: p.petName, emoji: getStageEmoji(p),
                            });
                        }
                    });
                });
                if (teens.length === 0) {
                    fence.innerHTML = '<div class="zoo-empty">No teen pets yet. Feed your baby pet to help it grow!</div>';
                    return;
                }
                teens.forEach(t => {
                    const div = document.createElement('div');
                    div.className = 'zoo-pet';
                    div.innerHTML = `
                        <div class="zoo-pet-emoji">${t.emoji}</div>
                        <div class="zoo-pet-name">${escapeHtml(t.petName)}</div>
                        <div class="zoo-pet-owner">👤 ${escapeHtml(t.ownerName)}</div>
                    `;
                    fence.appendChild(div);
                });
            }

            function renderCards() {
                const grid = document.getElementById('classGrid');
                grid.innerHTML = '';
                students.forEach((student, index) => {
                    grid.appendChild(createStudentCard(student, index));
                });
            }

            function createStudentCard(student, index) {
                const card = document.createElement('div');
                card.className = 'student-card';

                const top = document.createElement('div');
                top.className = 'card-top';

                const nameRow = document.createElement('div');
                nameRow.className = 'student-name-row';
                nameRow.innerHTML = `<span>🧑‍🎓</span>`;
                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.value = student.studentName;
                nameInput.maxLength = 8;
                nameInput.addEventListener('input', (e) => {
                    students[index].studentName = e.target.value.trim() || '同学';
                    saveData();
                    renderZoo(); renderFreeRange();
                });
                nameInput.addEventListener('blur', (e) => {
                    let val = e.target.value.trim();
                    if (val === '') {
                        students[index].studentName = DEFAULT_NAMES[index] || `同学${index+1}`;
                        nameInput.value = students[index].studentName;
                    } else {
                        students[index].studentName = val;
                    }
                    saveData();
                    renderZoo(); renderFreeRange();
                });
                nameRow.appendChild(nameInput);
                top.appendChild(nameRow);

                const scoreDiv = document.createElement('div');
                scoreDiv.className = 'mini-score';
                scoreDiv.innerHTML = `<span>⭐</span><span class="score-value" data-role="score">${student.score}</span>`;
                top.appendChild(scoreDiv);
                card.appendChild(top);

                const slots = document.createElement('div');
                slots.className = 'pet-slots';
                student.pets.forEach((pet, slotIdx) => {
                    slots.appendChild(createPetSlot(student, index, pet, slotIdx));
                });
                card.appendChild(slots);
                return card;
            }

            function createPetSlot(student, studentIdx, pet, slotIdx) {
                const slot = document.createElement('div');
                slot.className = 'pet-slot';

                const label = document.createElement('div');
                label.className = 'slot-label';
                label.textContent = `SLOT ${slotIdx + 1}`;
                slot.appendChild(label);

                const emojiDiv = document.createElement('div');
                emojiDiv.className = 'pet-emoji-sm ' + (pet.isEgg ? 'egg ' : '') + 'stage-' + pet.stage;
                emojiDiv.textContent = getStageEmoji(pet);
                slot.appendChild(emojiDiv);

                const petNameSpan = document.createElement('div');
                petNameSpan.className = 'pet-name-sm';
                petNameSpan.textContent = pet.petName;
                petNameSpan.title = '点击修改宠物名字';
                petNameSpan.addEventListener('click', () => startEditPetName(studentIdx, slotIdx, petNameSpan));
                slot.appendChild(petNameSpan);

                if (!pet.isEgg) {
                    const stageBadge = document.createElement('div');
                    stageBadge.className = 'stage-badge ' + pet.stage;
                    stageBadge.textContent = getStageLabel(pet.stage);
                    slot.appendChild(stageBadge);
                }

                const mood = getMood(pet);
                const moodDiv = document.createElement('div');
                moodDiv.className = 'mood-mini ' + mood.className;
                moodDiv.textContent = mood.emoji + ' ' + mood.label;
                slot.appendChild(moodDiv);

                const statusMini = document.createElement('div');
                statusMini.className = 'status-mini';
                const hRow = document.createElement('div');
                hRow.className = 'status-mini-row';
                hRow.innerHTML = `<span>🍖</span><div class="bar-bg-xs"><div class="bar-fill-xs hunger" style="width:${pet.hunger}%"></div></div>`;
                const tRow = document.createElement('div');
                tRow.className = 'status-mini-row';
                tRow.innerHTML = `<span>💧</span><div class="bar-bg-xs"><div class="bar-fill-xs thirst" style="width:${pet.thirst}%"></div></div>`;
                statusMini.appendChild(hRow);
                statusMini.appendChild(tRow);
                slot.appendChild(statusMini);

                if (!pet.isEgg) {
                    const choiceRow = document.createElement('div');
                    choiceRow.className = 'pet-choice-row';
                    PET_TYPES.forEach(petType => {
                        const btn = document.createElement('button');
                        btn.className = 'pet-choice-btn' + (pet.petType === petType.id ? ' active' : '');
                        btn.innerHTML = petType.emoji;
                        btn.title = petType.name;
                        btn.addEventListener('click', () => {
                            students[studentIdx].pets[slotIdx].petType = petType.id;
                            updateStage(students[studentIdx].pets[slotIdx]);
                            saveData();
                            renderAll();
                        });
                        choiceRow.appendChild(btn);
                    });
                    slot.appendChild(choiceRow);
                }

                const actions = document.createElement('div');
                actions.className = 'slot-actions';

                const hatchBtn = document.createElement('button');
                hatchBtn.className = 'mini-btn hatch';
                hatchBtn.innerHTML = '🐣20';
                hatchBtn.title = 'Hatch (20 pts)';
                hatchBtn.disabled = !pet.isEgg || student.score < SCORE_HATCH_COST;
                hatchBtn.addEventListener('click', () => handleHatch(studentIdx, slotIdx));
                actions.appendChild(hatchBtn);

                const fruitBtn = document.createElement('button');
                fruitBtn.className = 'mini-btn feed';
                fruitBtn.innerHTML = '🍎+1';
                fruitBtn.disabled = student.score >= MAX_SCORE;
                fruitBtn.addEventListener('click', () => handleFeed(studentIdx, slotIdx, 'fruit'));
                actions.appendChild(fruitBtn);

                const foodBtn = document.createElement('button');
                foodBtn.className = 'mini-btn chicken';
                foodBtn.innerHTML = '🍗+2';
                foodBtn.disabled = student.score >= MAX_SCORE;
                foodBtn.addEventListener('click', () => handleFeed(studentIdx, slotIdx, 'food'));
                actions.appendChild(foodBtn);

                const waterBtn = document.createElement('button');
                waterBtn.className = 'mini-btn water';
                waterBtn.innerHTML = '💧+1';
                waterBtn.disabled = student.score >= MAX_SCORE;
                waterBtn.addEventListener('click', () => handleWater(studentIdx, slotIdx));
                actions.appendChild(waterBtn);

                const thirstyBtn = document.createElement('button');
                thirstyBtn.className = 'mini-btn thirsty';
                thirstyBtn.innerHTML = '🥵-1';
                thirstyBtn.title = 'Thirsty -1';
                if (pet.isEgg) thirstyBtn.disabled = true;
                else thirstyBtn.disabled = student.score < 1;
                thirstyBtn.addEventListener('click', () => handleThirsty(studentIdx, slotIdx));
                actions.appendChild(thirstyBtn);

                const hungryBtn = document.createElement('button');
                hungryBtn.className = 'mini-btn hungry';
                hungryBtn.innerHTML = '😫-2';
                hungryBtn.title = 'Hungry -2';
                if (pet.isEgg) hungryBtn.disabled = true;
                else hungryBtn.disabled = student.score < 2;
                hungryBtn.addEventListener('click', () => handleHungry(studentIdx, slotIdx));
                actions.appendChild(hungryBtn);

                slot.appendChild(actions);
                return slot;
            }

            function startEditPetName(studentIdx, slotIdx, petNameSpan) {
                if (petNameSpan.querySelector('input')) return;
                const pet = students[studentIdx].pets[slotIdx];
                const currentName = pet.petName;
                petNameSpan.innerHTML = '';
                const input = document.createElement('input');
                input.type = 'text';
                input.value = currentName;
                input.maxLength = 10;
                petNameSpan.appendChild(input);
                input.focus();
                input.select();
                const finish = () => {
                    let val = input.value.trim();
                    if (val === '') val = pet.isEgg ? '蛋蛋' : (PET_NAMES[Math.floor(Math.random() * PET_NAMES.length)]);
                    pet.petName = val;
                    petNameSpan.textContent = val;
                    saveData();
                    renderZoo(); renderFreeRange();
                };
                input.addEventListener('blur', finish);
                input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
            }

            function renderFreeRange() {
                const container = document.getElementById('freeRange');
                container.innerHTML = '';
                const adults = [];
                students.forEach(s => {
                    s.pets.forEach(p => {
                        if (!p.isEgg && p.stage === 'adult' && p.petType) {
                            adults.push({
                                petId: p.id, ownerName: s.studentName,
                                petName: p.petName, emoji: getStageEmoji(p),
                            });
                        }
                    });
                });
                const w = window.innerWidth;
                const h = 240;
                adults.forEach(a => {
                    const div = document.createElement('div');
                    div.className = 'free-pet';
                    div.style.left = (Math.random() * (w - 80)) + 'px';
                    div.style.top = (Math.random() * (h - 80) + 40) + 'px';
                    div.dataset.petId = a.petId;
                    div.innerHTML = `
                        <div class="free-pet-emoji">${a.emoji}</div>
                        <div class="free-pet-name">${escapeHtml(a.petName)} · ${escapeHtml(a.ownerName)}</div>
                    `;
                    container.appendChild(div);
                });
                startFreeMove();
            }

            function startFreeMove() {
                if (freeMoveInterval) clearInterval(freeMoveInterval);
                freeMoveInterval = setInterval(() => {
                    const pets = document.querySelectorAll('.free-pet');
                    if (pets.length === 0) return;
                    const w = window.innerWidth;
                    const h = 240;
                    pets.forEach(el => {
                        el.style.left = (Math.random() * (w - 80)) + 'px';
                        el.style.top = (Math.random() * (h - 80) + 40) + 'px';
                    });
                }, 5000);
            }

            // ============ 操作 ============
            function handleHatch(sIdx, slotIdx) {
                const student = students[sIdx];
                const pet = student.pets[slotIdx];
                if (!pet.isEgg) return;
                if (student.score < SCORE_HATCH_COST) {
                    SoundFX.error();
                    return;
                }
                student.score -= SCORE_HATCH_COST;
                pet.isEgg = false;
                if (pet.petName === '蛋蛋') {
                    pet.petName = PET_NAMES[Math.floor(Math.random() * PET_NAMES.length)];
                }
                pet.hunger = 100;
                pet.thirst = 100;
                pet.feedCount = 0;
                pet.stage = 'baby';
                pet.petType = null;
                SoundFX.hatch();  // 🐣 孵蛋音效
                saveData();
                renderAll();
                startGlobalDecay();
            }

            function handleFeed(sIdx, slotIdx, type) {
                const student = students[sIdx];
                const pet = student.pets[slotIdx];
                if (student.score >= MAX_SCORE) return;
                const opt = FEED_OPTIONS[type];
                if (!opt) return;
                const oldScore = student.score;
                student.score = Math.min(MAX_SCORE, student.score + opt.score);

                if (opt.hunger > 0) pet.hunger = Math.min(100, pet.hunger + opt.hunger);
                if (opt.thirst > 0) pet.thirst = Math.min(100, pet.thirst + opt.thirst);
                if (!pet.isEgg) {
                    pet.feedCount += 1;
                    updateStage(pet);
                }

                // 🎵 播放对应音效
                if (type === 'fruit') SoundFX.fruit();
                else if (type === 'food') SoundFX.food();

                saveData();
                renderAll();
            }

            function handleWater(sIdx, slotIdx) {
                const student = students[sIdx];
                const pet = student.pets[slotIdx];
                if (student.score >= MAX_SCORE) return;
                const opt = FEED_OPTIONS.water;
                const oldScore = student.score;
                student.score = Math.min(MAX_SCORE, student.score + opt.score);
                pet.thirst = Math.min(100, pet.thirst + opt.thirst);
                if (!pet.isEgg) {
                    pet.feedCount += 1;
                    updateStage(pet);
                }
                SoundFX.water();  // 💧 喝水音效
                saveData();
                renderAll();
            }

            function handleThirsty(sIdx, slotIdx) {
                const student = students[sIdx];
                const pet = student.pets[slotIdx];
                if (pet.isEgg || student.score < 1) {
                    SoundFX.error();
                    return;
                }
                student.score -= 1;
                pet.thirst = Math.max(0, pet.thirst - 15);
                updateStage(pet);
                SoundFX.thirsty();  // 🥵 口渴音效
                saveData();
                renderAll();
            }

            function handleHungry(sIdx, slotIdx) {
                const student = students[sIdx];
                const pet = student.pets[slotIdx];
                if (pet.isEgg || student.score < 2) {
                    SoundFX.error();
                    return;
                }
                student.score -= 2;
                pet.hunger = Math.max(0, pet.hunger - 20);
                updateStage(pet);
                SoundFX.hungry();  // 😫 饥饿音效
                saveData();
                renderAll();
            }

            function startGlobalDecay() {
                if (globalDecayInterval) return;
                globalDecayInterval = setInterval(() => {
                    let changed = false;
                    students.forEach(s => {
                        s.pets.forEach(p => {
                            if (p.isEgg) return;
                            let c = false;
                            if (p.hunger > 0) { p.hunger = Math.max(0, p.hunger - 1); c = true; }
                            if (p.thirst > 0) { p.thirst = Math.max(0, p.thirst - 1); c = true; }
                            if (c) { changed = true; updateStage(p); }
                        });
                    });
                    if (changed) { saveData(); renderAll(); }
                }, DECAY_INTERVAL_MS);
            }

            function stopGlobalDecay() {
                if (globalDecayInterval) { clearInterval(globalDecayInterval); globalDecayInterval = null; }
                if (freeMoveInterval) { clearInterval(freeMoveInterval); freeMoveInterval = null; }
            }

            function resetAll() {
                if (!confirm('Reset all 25 students and all pets?')) return;
                stopGlobalDecay();
                localStorage.removeItem(STORAGE_KEY);
                initStudents();
                renderAll();
                saveData();
                startGlobalDecay();
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
            }

            // ============ 音效开关事件 ============
            document.getElementById('soundToggle').addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                updateSoundToggleUI();
                // 播放一个确认音（如果是打开）
                if (soundEnabled) SoundFX.fruit();
            });

            // 首次用户交互时初始化音频上下文
            document.body.addEventListener('click', () => {
                getAudioCtx();
            }, { once: true });

            // ============ 启动 ============
            function initApp() {
                const loaded = loadData();
                if (!loaded) initStudents();
                renderAll();
                document.getElementById('resetAllBtn').addEventListener('click', resetAll);
                updateSoundToggleUI();
                startGlobalDecay();
                window.addEventListener('resize', () => renderFreeRange());
            }

            window.addEventListener('DOMContentLoaded', initApp);
        })();
    </script>
</body>
</html>
